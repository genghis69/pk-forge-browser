name: Construire Google Pack WebAssembly et publier APK Forge
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: apk-forge-browser
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: Récupérer APK Forge Browser
        uses: actions/checkout@v5
      - name: Vérifier les modules JavaScript
        run: |
          node --check src/app.mjs
          node --check src/android-compiler.mjs
          node --check src/android-sources.mjs
          node --test tests/android-sources.test.mjs
          node --check src/crypto.mjs
          node --check src/sample.mjs
          node --check src/analyzer.mjs
          node --check src/kotlin-lab.mjs
          node --check src/compiler-results.mjs
          node --check src/jvm-artifacts.mjs
          node --check ci/build-android-manifest.mjs
          node --test tests/jvm-artifacts.test.mjs
          node --test tests/compiler-results.test.mjs
          node --check src/toolchain-paths.mjs
          node --test tests/toolchain-paths.test.mjs
          node --test tests/analyzer.test.mjs
      - name: Vérifier la démonstration sans code
        run: |
          node -e "import('./src/sample.mjs').then(m => { if (!String(m.createSampleZip).includes('AndroidManifest.xml')) process.exit(1); })"
      - name: Préparer Java 17 pour vérifier le compilateur Kotlin
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Récupérer Kotlin 2.2.20 et ses dépendances Maven
        run: |
          mkdir -p dist/toolchains/kotlin/2.2.20/jars
          mvn -B -ntp -f ci/kotlin-runtime.pom.xml dependency:copy-dependencies -DincludeScope=runtime -DoutputDirectory="$GITHUB_WORKSPACE/dist/toolchains/kotlin/2.2.20/jars"
          test -s dist/toolchains/kotlin/2.2.20/jars/kotlin-compiler-embeddable-2.2.20.jar
      - name: Adapter Kotlin à CheerpJ (CPU par thread non disponible)
        run: |
          set -euo pipefail
          javac --add-exports java.base/jdk.internal.org.objectweb.asm=ALL-UNNAMED -d ci ci/PatchKotlinCpuTime.java
          java --add-exports java.base/jdk.internal.org.objectweb.asm=ALL-UNNAMED -cp ci PatchKotlinCpuTime "dist/toolchains/kotlin/2.2.20/jars/kotlin-compiler-embeddable-2.2.20.jar"
          if javap -classpath dist/toolchains/kotlin/2.2.20/jars/kotlin-compiler-embeddable-2.2.20.jar -c -p org.jetbrains.kotlin.util.PerformanceManager |
            grep -E 'ThreadMXBean\.(setThreadCpuTimeEnabled|getCurrentThreadUserTime|getCurrentThreadCpuTime)'; then
            echo "::error::Le compilateur Kotlin appelle encore les fonctions CPU non prises en charge par CheerpJ"
            exit 1
          fi
      - name: Compiler un vrai fichier Kotlin en classes JVM sur la machine de validation
        run: |
          set -euo pipefail
          KOTLIN_CP="$(find dist/toolchains/kotlin/2.2.20/jars -name '*.jar' -print | paste -sd ':' -)"
          mkdir -p kotlin-ci
          java -cp "$KOTLIN_CP" org.jetbrains.kotlin.cli.jvm.K2JVMCompiler -no-reflect -jvm-target 17 -classpath "dist/toolchains/kotlin/2.2.20/jars/kotlin-stdlib-2.2.20.jar" -d kotlin-ci ci/samples/ForgeProof.kt
          test -s kotlin-ci/ForgeProof.class
          javap -classpath kotlin-ci -verbose ForgeProof | grep 'major version: 61'
      - name: Essayer de préparer D8 pour le Web
        run: |
          mkdir -p dist/toolchains/r8/8.13.17
          if curl -fLsS --retry 3 --max-time 90 "https://dl.google.com/dl/android/maven2/com/android/tools/r8/8.13.17/r8-8.13.17.jar" -o dist/toolchains/r8/8.13.17/r8-8.13.17.jar; then
            mkdir -p dex-ci
            java -cp dist/toolchains/r8/8.13.17/r8-8.13.17.jar com.android.tools.r8.D8 --min-api 26 --output dex-ci kotlin-ci/ForgeProof.class
            test -s dex-ci/classes.dex
          else
            rm -f dist/toolchains/r8/8.13.17/r8-8.13.17.jar
            echo "::warning::D8 indisponible, la démonstration se limitera aux fichiers .class"
          fi
      - name: Créer le catalogue de fichiers Kotlin
        run: |
          node ci/build-manifest.mjs
          test -s dist/toolchains/kotlin/2.2.20/manifest.json
      - name: Installer Android SDK 36 pour compiler localement dans le navigateur
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36'
      - name: Préparer android.jar API 36
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK"
          test -s "$SDK/platforms/android-36/android.jar"
          mkdir -p dist/toolchains/android/sdk/36
          cp "$SDK/platforms/android-36/android.jar" dist/toolchains/android/sdk/36/android.jar
      - name: Installer Gradle pour la résolution des bibliothèques Maven
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Résoudre AndroidX Core et USB Serial uniquement
        run: |
          gradle --no-daemon -p ci stageAndroidClasspath --stacktrace
      - name: Construire et tester l'assembleur JAR pour Kotlin dans Chrome
        run: |
          set -euo pipefail
          mkdir -p ci/build/classes dist/toolchains/android/helpers/1
          javac --release 17 -d ci/build/classes ci/BuildClassesJar.java
          jar --create --file dist/toolchains/android/helpers/1/classes-tool.jar -C ci/build/classes .
          KCP="$(find dist/toolchains/kotlin/2.2.20/jars -name '*.jar' -print | paste -sd ':' -)"
          mkdir -p ci/build/proof
          java -cp "$KCP" org.jetbrains.kotlin.cli.jvm.K2JVMCompiler -no-reflect -jvm-target 17 -classpath "dist/toolchains/android/sdk/36/android.jar:dist/toolchains/kotlin/2.2.20/jars/kotlin-stdlib-2.2.20.jar" -d ci/build/proof ci/samples/AndroidProof.kt
          test -s ci/build/proof/dev/apkforge/proof/AndroidProof.class
          java -cp dist/toolchains/android/helpers/1/classes-tool.jar dev.apkforge.tools.BuildClassesJar ci/build/proof ci/build/android-proof.jar
          unzip -t ci/build/android-proof.jar
          mkdir -p ci/build/dex
          java -cp dist/toolchains/r8/8.13.17/r8-8.13.17.jar com.android.tools.r8.D8 --min-api 26 --lib dist/toolchains/android/sdk/36/android.jar --output ci/build/dex ci/build/android-proof.jar
          test -s ci/build/dex/classes.dex
      - name: Cataloguer SDK et bibliothèques Android
        run: |
          node ci/build-android-manifest.mjs
          test -s dist/toolchains/android/manifest.json
      - name: Installer le compilateur Protocol Buffers requis par Google Pack
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          protoc --version
      - name: Installer Rust et cible WASM
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Installer wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest
      - name: Récupérer Google Pack open source et figer la révision
        run: |
          git clone https://github.com/google/pack.git google-pack-source
          cd google-pack-source
          git checkout 7b60931e4058d892344ac57e49fcb582fd349b76
      - name: Compiler le moteur Google Pack pour Chrome
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist/wasm/pack"
          # wasm-pack v0.15 doit être exécuté depuis le crate pack-wasm
          # et non la racine du workspace Cargo de Google Pack.
          cd google-pack-source/pack-wasm
          test -f Cargo.toml
          grep -q '^\[package\]' Cargo.toml
          # Binaryen wasm-opt livré avec wasm-pack ne reconnaît pas encore
          # les modules multi-tables générés par Rust 1.99.1.
          # wasm-bindgen reste actif; seule l'optimisation wasm-opt est désactivée.
          printf '\n[package.metadata.wasm-pack.profile.release]\nwasm-opt = false\n' >> Cargo.toml
          wasm-pack build . --release --target web --out-name pack_wasm --out-dir "$GITHUB_WORKSPACE/dist/wasm/pack"
          test -s "$GITHUB_WORKSPACE/dist/wasm/pack/pack_wasm.js"
          test -s "$GITHUB_WORKSPACE/dist/wasm/pack/pack_wasm_bg.wasm"
      - name: Vérifier que les JAR sont bien publiés à leur chemin GitHub Pages
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import {toolchainUrl,toCheerpJPath,kotlinJarRelative} from './src/toolchain-paths.mjs';
          const origin='https://genghis69.github.io/pk-forge-browser/src/kotlin-lab.mjs';
          const index=JSON.parse(fs.readFileSync('dist/toolchains/kotlin/2.2.20/manifest.json','utf8'));
          for(const jar of index.jars){
            const relative=kotlinJarRelative(jar);
            const u=toolchainUrl(relative,origin);
            const javaPath=toCheerpJPath(relative,origin);
            if(!javaPath.startsWith('/app/pk-forge-browser/'))throw Error('Chemin CheerpJ incorrect: '+javaPath);
            const file=path.join('dist/toolchains',relative);
            if(!fs.existsSync(file)||fs.statSync(file).size<1000)throw Error('Fichier Kotlin manquant : '+file);
          }
          console.log('Vérification des chemins OK : '+index.jars.length+' bibliothèques.');
          NODE
      - name: Préparer le site statique
        run: |
          cp index.html dist/
          mkdir -p dist/src
          cp src/*.mjs dist/src/
          cp README.md dist/
          cp google-pack-source/LICENSE dist/LICENSE-GOOGLE-PACK
          touch dist/.nojekyll
          test -s dist/index.html
      - name: Fournir l'archive complète avec WASM
        uses: actions/upload-artifact@v4
        with:
          name: apk-forge-browser-avec-wasm
          path: dist/
          retention-days: 30
      - name: Détecter si GitHub Pages est activé
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages disponible : préparation du déploiement."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Le WASM est compilé et téléchargeable dans les Artifacts. Active GitHub Pages dans Settings > Pages > Source: GitHub Actions pour la publication automatique."
          fi
      - name: Configurer GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - name: Préparer le site pour GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
  deploy:
    needs: build
    if: needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer le compilateur statique
        id: deployment
        uses: actions/deploy-pages@v4
