name: Construire Google Pack WebAssembly et publier APK Forge
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ['Portage AAPT2 original vers WebAssembly (expérimental)']
    types: [completed]
permissions:
  contents: read
  pages: write
  actions: read
  id-token: write
concurrency:
  group: apk-forge-browser
  cancel-in-progress: true
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: Récupérer APK Forge Browser
        uses: actions/checkout@v5
      - name: Vérifier les modules JavaScript
        run: |
          node --check src/app.mjs
          node --check src/android-compiler.mjs
          node --check src/java-sources.mjs
          node --check src/ecj-browser-args.mjs
          node --test tests/ecj-browser-args.test.mjs
          node --check src/ads-dependencies.mjs
          node --test tests/ads-dependencies.test.mjs
          node --check src/gradle-generated.mjs
          node --test tests/gradle-generated.test.mjs
          node --check ci/verify-ads-classpath.mjs
          node --test tests/java-sources.test.mjs
          node --check src/real-resources.mjs
          node --check src/aapt2-diagnostics.mjs
          node --test tests/aapt2-diagnostics.test.mjs
          node --check src/aapt2-wasm.mjs
          node --test tests/aapt2-wasm.test.mjs
          node --check src/auto-build.mjs
          node --test tests/auto-build.test.mjs
          node --check src/apk-launch-check.mjs
          node --test tests/apk-launch-check.test.mjs
          node --check src/dex-integrity.mjs
          node --check ci/verify-d8-zip.mjs
          node --test tests/dex-integrity.test.mjs
          node --check src/apk-structure.mjs
          node --test tests/apk-structure.test.mjs
          node --check ci/test-aapt2-link.mjs
          node --check ci/verify-aapt2-wasm-resources.mjs
          node --check ci/verify-real-aapt2-wasm.mjs
          node --check ci/verify-aapt2-browser-adapter.mjs
          node --test tests/real-resources.test.mjs
          node --check ci/extend-pack.mjs
          node --test tests/decouple-d8.test.mjs
          node --check src/d8-threading.mjs
          node --test tests/d8-threading.test.mjs
          node --check src/compilation-observer.mjs
          node --test tests/compilation-observer.test.mjs
          node --check src/runtime-dex.mjs
          node --test tests/runtime-dex.test.mjs
          node --check src/android-sources.mjs
          node --test tests/android-sources.test.mjs
          node --check src/crypto.mjs
          node --check src/sample.mjs
          node --check src/analyzer.mjs
          node --check src/project-support.mjs
          node --test tests/project-support.test.mjs
          node --check src/kotlin-lab.mjs
          node --check src/compiler-results.mjs
          node --check src/jvm-artifacts.mjs
          node --check ci/build-android-manifest.mjs
          node --test tests/jvm-artifacts.test.mjs
          node --check ci/verify-toolchains.mjs
          node --test tests/compiler-results.test.mjs
          node --check src/toolchain-paths.mjs
          node --test tests/toolchain-paths.test.mjs
          node --test tests/analyzer.test.mjs
      - name: Vérifier la démonstration sans code
        run: |
          node -e "import('./src/sample.mjs').then(m => { if (!String(m.createSampleZip).includes('AndroidManifest.xml')) process.exit(1); })"
      - name: Préparer Java 17 pour vérifier le compilateur Kotlin
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Récupérer Kotlin 2.2.20 et ses dépendances Maven
        run: |
          mkdir -p dist/toolchains/kotlin/2.2.20/jars
          mvn -B -ntp -f ci/kotlin-runtime.pom.xml dependency:copy-dependencies -DincludeScope=runtime -DoutputDirectory="$GITHUB_WORKSPACE/dist/toolchains/kotlin/2.2.20/jars"
          test -s dist/toolchains/kotlin/2.2.20/jars/kotlin-compiler-embeddable-2.2.20.jar
      - name: Adapter Kotlin à CheerpJ (CPU par thread non disponible)
        run: |
          set -euo pipefail
          javac --add-exports java.base/jdk.internal.org.objectweb.asm=ALL-UNNAMED -d ci ci/PatchKotlinCpuTime.java
          java --add-exports java.base/jdk.internal.org.objectweb.asm=ALL-UNNAMED -cp ci PatchKotlinCpuTime "dist/toolchains/kotlin/2.2.20/jars/kotlin-compiler-embeddable-2.2.20.jar"
          if javap -classpath dist/toolchains/kotlin/2.2.20/jars/kotlin-compiler-embeddable-2.2.20.jar -c -p org.jetbrains.kotlin.util.PerformanceManager |
            grep -E 'ThreadMXBean\.(setThreadCpuTimeEnabled|getCurrentThreadUserTime|getCurrentThreadCpuTime)'; then
            echo "::error::Le compilateur Kotlin appelle encore les fonctions CPU non prises en charge par CheerpJ"
            exit 1
          fi
      - name: Compiler un vrai fichier Kotlin en classes JVM sur la machine de validation
        run: |
          set -euo pipefail
          KOTLIN_CP="$(find dist/toolchains/kotlin/2.2.20/jars -name '*.jar' -print | paste -sd ':' -)"
          mkdir -p kotlin-ci
          java -cp "$KOTLIN_CP" org.jetbrains.kotlin.cli.jvm.K2JVMCompiler -no-reflect -jvm-target 17 -classpath "dist/toolchains/kotlin/2.2.20/jars/kotlin-stdlib-2.2.20.jar" -d kotlin-ci ci/samples/ForgeProof.kt
          test -s kotlin-ci/ForgeProof.class
          javap -classpath kotlin-ci -verbose ForgeProof | grep 'major version: 61'
      - name: Essayer de préparer D8 pour le Web
        run: |
          mkdir -p dist/toolchains/r8/8.13.17
          if curl -fLsS --retry 3 --max-time 90 "https://dl.google.com/dl/android/maven2/com/android/tools/r8/8.13.17/r8-8.13.17.jar" -o dist/toolchains/r8/8.13.17/r8-8.13.17.jar; then
            mkdir -p dex-ci
            java -cp dist/toolchains/r8/8.13.17/r8-8.13.17.jar com.android.tools.r8.D8 --min-api 26 --output dex-ci kotlin-ci/ForgeProof.class
            test -s dex-ci/classes.dex
          else
            rm -f dist/toolchains/r8/8.13.17/r8-8.13.17.jar
            echo "::warning::D8 indisponible, la démonstration se limitera aux fichiers .class"
          fi
      - name: Adapter D8 obfusqué aux écritures NIO 16 bits sous CheerpJ
        run: |
          set -euo pipefail
          D8=dist/toolchains/r8/8.13.17/r8-8.13.17.jar
          test -s "$D8"
          mkdir -p ci/build/d8-short-original ci/build/d8-short-classes ci/build/d8-short-transformer
          cp "$D8" ci/build/d8-short-original/r8-original.jar
          javac --release 17 -d ci/build/d8-short-classes ci/ApkForgeNioShortCompat.java
          javac --add-exports java.base/jdk.internal.org.objectweb.asm=ALL-UNNAMED \
            -d ci/build/d8-short-transformer ci/PatchD8NioCalls.java
          java --add-exports java.base/jdk.internal.org.objectweb.asm=ALL-UNNAMED \
            -cp ci/build/d8-short-transformer PatchD8NioCalls \
            "$D8" ci/build/d8-short-original/r8-patched.jar
          mv ci/build/d8-short-original/r8-patched.jar "$D8"
          jar --update --file "$D8" -C ci/build/d8-short-classes \
            com/android/tools/r8/dex/ApkForgeNioShortCompat.class \
            -C ci/build/d8-short-classes \
            com/android/tools/r8/dex/ApkForgeNioShortCompat\$View.class
          unzip -t "$D8" | tail -1
          mkdir -p ci/build/d8-before ci/build/d8-after
          java -cp ci/build/d8-short-original/r8-original.jar com.android.tools.r8.D8 \
            --thread-count 1 --min-api 26 --output ci/build/d8-before \
            kotlin-ci/ForgeProof.class
          java -cp "$D8" com.android.tools.r8.D8 \
            --thread-count 1 --min-api 26 --output ci/build/d8-after \
            kotlin-ci/ForgeProof.class
          cmp ci/build/d8-before/classes.dex ci/build/d8-after/classes.dex
          echo "PATCH D8 : le résultat natif original et corrigé est strictement identique."
      - name: Créer le catalogue de fichiers Kotlin
        run: |
          node ci/build-manifest.mjs
          test -s dist/toolchains/kotlin/2.2.20/manifest.json
      - name: Installer Android SDK 36 pour compiler localement dans le navigateur
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36'
      - name: Préparer android.jar API 36
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK"
          test -s "$SDK/platforms/android-36/android.jar"
          mkdir -p dist/toolchains/android/sdk/36
          cp "$SDK/platforms/android-36/android.jar" dist/toolchains/android/sdk/36/android.jar
      - name: Installer Gradle pour la résolution des bibliothèques Maven
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Résoudre AndroidX Core et USB Serial uniquement
        run: |
          gradle --no-daemon -p ci stageAndroidClasspath --stacktrace
      - name: Résoudre le véritable AppLovin MAX et Google Ads Identifier depuis Maven
        run: |
          set -euo pipefail
          gradle --no-daemon -p ci stageTrainManagerAdsLibraries --stacktrace
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p='dist/toolchains/android/deps/trainmanager-ads-v1/resolved.json';
          const x=JSON.parse(fs.readFileSync(p,'utf8'));
          if(x.artifacts.length<2)throw Error('Dépendances publicitaires manquantes');
          for(const a of x.artifacts){
            if(!/^[0-9a-f]{64}$/.test(a.sha256)||a.size<100)
              throw Error('Catalogue ad SDK invalide : '+a.file);
            console.log(a.group+':'+a.name+':'+a.version+' '+a.extension+' res='+a.resourceCount);
          }
          NODE
      - name: Vérifier les véritables classes Maven AppLovin et Google Ads
        run: |
          set -euo pipefail
          node ci/verify-ads-classpath.mjs
          mapfile -t AD_JARS < <(node ci/verify-ads-classpath.mjs --classpath)
          test "${#AD_JARS[@]}" -gt 2
          ADS_CP="$(printf '%s\n' "${AD_JARS[@]}" | paste -sd ':' -)"
          mkdir -p ci/build/ads-proof
          javac --release 17 -cp "dist/toolchains/android/sdk/36/android.jar:$ADS_CP" \
            -d ci/build/ads-proof ci/samples/AdsSdkProof.java
          test -s ci/build/ads-proof/dev/apkforge/browser/proof/AdsSdkProof.class
          echo "AppLovin MAX et Google Ads : vrais types et signatures Java vérifiés."
      - name: Construire et tester l'assembleur JAR pour Kotlin dans Chrome
        run: |
          set -euo pipefail
          mkdir -p ci/build/classes dist/toolchains/android/helpers/1
          javac --release 17 -d ci/build/classes ci/BuildClassesJar.java
          jar --create --file dist/toolchains/android/helpers/1/classes-tool.jar -C ci/build/classes .
          KCP="$(find dist/toolchains/kotlin/2.2.20/jars -name '*.jar' -print | paste -sd ':' -)"
          mkdir -p ci/build/proof
          java -cp "$KCP" org.jetbrains.kotlin.cli.jvm.K2JVMCompiler -no-reflect -jvm-target 17 -classpath "dist/toolchains/android/sdk/36/android.jar:dist/toolchains/kotlin/2.2.20/jars/kotlin-stdlib-2.2.20.jar" -d ci/build/proof ci/samples/AndroidProof.kt
          test -s ci/build/proof/dev/apkforge/proof/AndroidProof.class
          java -cp dist/toolchains/android/helpers/1/classes-tool.jar dev.apkforge.tools.BuildClassesJar ci/build/proof ci/build/android-proof.jar
          unzip -t ci/build/android-proof.jar
          mkdir -p ci/build/dex
          java -cp dist/toolchains/r8/8.13.17/r8-8.13.17.jar com.android.tools.r8.D8 --min-api 26 --lib dist/toolchains/android/sdk/36/android.jar --output ci/build/dex ci/build/android-proof.jar
          test -s ci/build/dex/classes.dex
      - name: Télécharger et valider Eclipse ECJ Java 17 pour CheerpJ
        run: |
          set -euo pipefail
          mkdir -p dist/toolchains/android/java/ecj/3.43.0
          mvn -B -ntp dependency:get -Dartifact=org.eclipse.jdt:ecj:3.43.0 -Dtransitive=false
          cp "$HOME/.m2/repository/org/eclipse/jdt/ecj/3.43.0/ecj-3.43.0.jar" \
             dist/toolchains/android/java/ecj/3.43.0/ecj.jar
          test -s dist/toolchains/android/java/ecj/3.43.0/ecj.jar
          mkdir -p ci/build/java-ecj-proof
          java -cp dist/toolchains/android/java/ecj/3.43.0/ecj.jar \
            org.eclipse.jdt.internal.compiler.batch.Main \
            -17 -proc:none \
            -classpath dist/toolchains/android/sdk/36/android.jar \
            -d ci/build/java-ecj-proof ci/samples/BrowserActivity.java
          test -s ci/build/java-ecj-proof/dev/apkforge/browser/proof/BrowserActivity.class
          javap -classpath ci/build/java-ecj-proof -verbose dev.apkforge.browser.proof.BrowserActivity | grep 'major version: 61'
      - name: Compiler et tester le pont API ECJ Java 17 sans JDK virtuel
        run: |
          set -euo pipefail
          ECJ_JAR=dist/toolchains/android/java/ecj/3.43.0/ecj.jar
          # Authentic Java 17 compile-only classes. Android SDK wins if a type
          # is defined in both archives. Never feed this JAR to D8 runtime.
          JAVA_BASE=dist/toolchains/android/java/jdk-17/java-base-compile.jar
          mkdir -p ci/build/jdk17-base dist/toolchains/android/java/jdk-17
          "$JAVA_HOME/bin/jmod" extract --dir ci/build/jdk17-base "$JAVA_HOME/jmods/java.base.jmod"
          jar --create --file "$JAVA_BASE" -C ci/build/jdk17-base/classes .
          unzip -tqq "$JAVA_BASE"
          unzip -Z -1 "$JAVA_BASE" | grep -Fx 'java/lang/invoke/LambdaMetafactory.class'
          unzip -Z -1 "$JAVA_BASE" | grep -Fx 'java/lang/Record.class'
          mkdir -p ci/build/ecj-api-classes dist/toolchains/android/helpers/1 ci/build/java-ecj-no-system
          javac --release 17 -cp "$ECJ_JAR" -d ci/build/ecj-api-classes ci/ApkForgeEcjCompiler.java
          test -s ci/build/ecj-api-classes/dev/apkforge/tools/ApkForgeEcjCompiler.class
          jar --create --file dist/toolchains/android/helpers/1/ecj-api-tool.jar -C ci/build/ecj-api-classes .
          unzip -tqq dist/toolchains/android/helpers/1/ecj-api-tool.jar
          mapfile -t AD_JARS < <(node ci/verify-ads-classpath.mjs --classpath)
          ADS_CP="$(printf '%s\n' "${AD_JARS[@]}" | paste -sd ':' -)"
          # Real ECJ compiler API, Java 17 and real Android/Maven bytecode.
          # This must NOT call ECJ batch.Main, as it scans java.home/lib/modules.
          java -cp "$ECJ_JAR:dist/toolchains/android/helpers/1/ecj-api-tool.jar" \
            dev.apkforge.tools.ApkForgeEcjCompiler \
            ci/build/java-ecj-no-system \
            "dist/toolchains/android/sdk/36/android.jar:$ADS_CP:$JAVA_BASE" \
            ci/samples/BrowserActivity.java ci/samples/AdsSdkProof.java
          test -s ci/build/java-ecj-no-system/dev/apkforge/browser/proof/BrowserActivity.class
          test -s ci/build/java-ecj-no-system/dev/apkforge/browser/proof/AdsSdkProof.class
          javap -classpath ci/build/java-ecj-no-system -verbose dev.apkforge.browser.proof.BrowserActivity | grep 'major version: 61'
          echo 'ECJ Java 17 par API, sans autodétection JDK et avec vrais SDK : validé.'
      - name: Cataloguer SDK et bibliothèques Android
        run: |
          node ci/build-android-manifest.mjs
          test -s dist/toolchains/android/manifest.json
      - name: Valider D8 avec toutes les bibliothèques d'exécution Android
        run: |
          set -euo pipefail
          mkdir -p ci/build/full-runtime-dex
          node --input-type=module <<'NODE' > ci/build/runtime-jars.txt
          import fs from 'node:fs';
          import {planRuntimeJars} from './src/runtime-dex.mjs';
          const index=JSON.parse(fs.readFileSync('dist/toolchains/android/manifest.json','utf8'));
          const plan=planRuntimeJars(index.artifacts);
          for(const jar of plan.dependencies) console.log('dist/toolchains/android/'+jar.relative);
          NODE
          mapfile -t RUNTIME_JARS < ci/build/runtime-jars.txt
          test "${#RUNTIME_JARS[@]}" -gt 2
          for jar in "${RUNTIME_JARS[@]}"; do test -s "$jar"; done
          java -Xmx3g -cp dist/toolchains/r8/8.13.17/r8-8.13.17.jar com.android.tools.r8.D8 \
            --thread-count 1 \
            --min-api 26 \
            --lib dist/toolchains/android/sdk/36/android.jar \
            --output ci/build/full-runtime-dex.zip \
            ci/build/android-proof.jar \
            dist/toolchains/kotlin/2.2.20/jars/kotlin-stdlib-2.2.20.jar \
            "${RUNTIME_JARS[@]}"
          test -s ci/build/full-runtime-dex.zip
          unzip -t ci/build/full-runtime-dex.zip
          unzip -Z -1 ci/build/full-runtime-dex.zip | grep -Fx 'classes.dex'
          node ci/verify-d8-zip.mjs ci/build/full-runtime-dex.zip
          echo "D8 runtime : DEX ZIP validés avec Kotlin Stdlib, AndroidX et USB."
      - name: Installer le compilateur Protocol Buffers requis par Google Pack
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          protoc --version
      - name: Installer Rust et cible WASM
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Installer wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest
      - name: Récupérer Google Pack open source et figer la révision
        run: |
          git clone https://github.com/google/pack.git google-pack-source
          cd google-pack-source
          git checkout 7b60931e4058d892344ac57e49fcb582fd349b76
      - name: Ajouter le compilateur de ressources et la signature APK incluant DEX
        run: |
          node ci/extend-pack.mjs
          grep -q 'mod apkforge' google-pack-source/pack-wasm/src/lib.rs
      - name: Compiler le moteur Google Pack pour Chrome
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist/wasm/pack"
          # wasm-pack v0.15 doit être exécuté depuis le crate pack-wasm
          # et non la racine du workspace Cargo de Google Pack.
          cd google-pack-source/pack-wasm
          test -f Cargo.toml
          grep -q '^\[package\]' Cargo.toml
          # Binaryen wasm-opt livré avec wasm-pack ne reconnaît pas encore
          # les modules multi-tables générés par Rust 1.99.1.
          # wasm-bindgen reste actif; seule l'optimisation wasm-opt est désactivée.
          printf '\n[package.metadata.wasm-pack.profile.release]\nwasm-opt = false\n' >> Cargo.toml
          wasm-pack build . --release --target web --out-name pack_wasm --out-dir "$GITHUB_WORKSPACE/dist/wasm/pack"
          test -s "$GITHUB_WORKSPACE/dist/wasm/pack/pack_wasm.js"
          test -s "$GITHUB_WORKSPACE/dist/wasm/pack/pack_wasm_bg.wasm"
      - name: Compiler une vraie Activity Kotlin pour l'APK WebAssembly de test
        run: |
          set -euo pipefail
          KOTLIN_CP="$(find dist/toolchains/kotlin/2.2.20/jars -name '*.jar' -print | paste -sd ':' -)"
          mkdir -p ci/build/android-activity ci/build/android-activity-dex
          java -cp "$KOTLIN_CP" org.jetbrains.kotlin.cli.jvm.K2JVMCompiler \
            -no-reflect -jvm-target 17 \
            -classpath "dist/toolchains/android/sdk/36/android.jar:dist/toolchains/kotlin/2.2.20/jars/kotlin-stdlib-2.2.20.jar" \
            -d ci/build/android-activity ci/samples/BrowserActivity.kt
          test -s ci/build/android-activity/dev/apkforge/browser/proof/MainActivity.class
          java -cp dist/toolchains/android/helpers/1/classes-tool.jar dev.apkforge.tools.BuildClassesJar ci/build/android-activity ci/build/android-activity.jar
          test -s ci/build/android-activity.jar
          java -cp dist/toolchains/r8/8.13.17/r8-8.13.17.jar com.android.tools.r8.D8 \
            --thread-count 1 --min-api 26 \
            --lib dist/toolchains/android/sdk/36/android.jar \
            --output ci/build/android-activity-dex \
            ci/build/android-activity.jar dist/toolchains/kotlin/2.2.20/jars/kotlin-stdlib-2.2.20.jar
          test -s ci/build/android-activity-dex/classes.dex
      - name: Construire une référence avec le véritable AAPT2 natif (CI uniquement)
        run: |
          set -euo pipefail
          sdkmanager --install "build-tools;35.0.0"
          node ci/test-aapt2-link.mjs --prepare
          AAPT2="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          test -x "$AAPT2"
          "$AAPT2" compile --dir ci/build/aapt2-src/res -o ci/build/aapt2-compiled.zip
          test -s ci/build/aapt2-compiled.zip
          "$AAPT2" link -o ci/build/aapt2-linked.apk \
            -I dist/toolchains/android/sdk/36/android.jar \
            --manifest ci/build/aapt2-src/AndroidManifest.xml \
            --output-text-symbols ci/build/aapt2-R.txt \
            --auto-add-overlay \
            -R ci/build/aapt2-compiled.zip
          node ci/test-aapt2-link.mjs --verify
      - name: Construire un APK de test avec le WASM et le DEX, puis vérifier sa signature
        run: |
          set -euo pipefail
          node ci/test-apk-pack.mjs
          test -s ci/build/apkforge-wasm-signed-proof.apk
          unzip -t ci/build/apkforge-wasm-signed-proof.apk
          unzip -Z -1 ci/build/apkforge-wasm-signed-proof.apk | grep -Fx 'classes.dex'
          unzip -Z -1 ci/build/apkforge-wasm-signed-proof.apk | grep -Fx 'resources.arsc'
          unzip -Z -1 ci/build/apkforge-wasm-signed-proof.apk | grep -Fx 'AndroidManifest.xml'
          test -s ci/build/apkforge-aapt2-wasm-signed-proof.apk
          unzip -t ci/build/apkforge-aapt2-wasm-signed-proof.apk
          unzip -Z -1 ci/build/apkforge-aapt2-wasm-signed-proof.apk | grep -Fx 'classes.dex'
          unzip -Z -1 ci/build/apkforge-aapt2-wasm-signed-proof.apk | grep -Fx 'res/layout/activity_main.xml'
          unzip -Z -1 ci/build/apkforge-aapt2-wasm-signed-proof.apk | grep -Fx 'res/drawable/panel.xml'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --min-sdk-version 26 --verbose ci/build/apkforge-wasm-signed-proof.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --min-sdk-version 26 --verbose ci/build/apkforge-aapt2-wasm-signed-proof.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 ci/build/apkforge-wasm-signed-proof.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 ci/build/apkforge-aapt2-wasm-signed-proof.apk
      - name: Vérifier que les JAR sont bien publiés à leur chemin GitHub Pages
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import {toolchainUrl,toCheerpJPath,kotlinJarRelative} from './src/toolchain-paths.mjs';
          const origin='https://genghis69.github.io/pk-forge-browser/src/kotlin-lab.mjs';
          const index=JSON.parse(fs.readFileSync('dist/toolchains/kotlin/2.2.20/manifest.json','utf8'));
          for(const jar of index.jars){
            const relative=kotlinJarRelative(jar);
            const u=toolchainUrl(relative,origin);
            const javaPath=toCheerpJPath(relative,origin);
            if(!javaPath.startsWith('/app/pk-forge-browser/'))throw Error('Chemin CheerpJ incorrect: '+javaPath);
            const file=path.join('dist/toolchains',relative);
            if(!fs.existsSync(file)||fs.statSync(file).size<1000)throw Error('Fichier Kotlin manquant : '+file);
          }
          console.log('Vérification des chemins OK : '+index.jars.length+' bibliothèques.');
          NODE
      - name: Contrôler les SHA-256 de tous les outils immédiatement avant publication
        run: |
          node ci/verify-toolchains.mjs
      - name: Importer AAPT2 WASM uniquement si le portage réel est validé
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LAST="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/aapt2-wasm-port.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].id // empty')"
          if [[ -z "$LAST" ]]; then
            echo "::notice::Aucun port AAPT2 WASM réel et vérifié. Le navigateur conservera le moteur Google Pack limité."
            exit 0
          fi
          mkdir -p dist/wasm/aapt2
          gh run download "$LAST" --repo "$GITHUB_REPOSITORY" \
            --name aapt2-wasm-authentique-verifie --dir dist/wasm/aapt2
          test -s dist/wasm/aapt2/aapt2.js
          test -s dist/wasm/aapt2/aapt2.wasm
          node ci/verify-real-aapt2-wasm.mjs dist/wasm/aapt2/aapt2.js
          node ci/verify-aapt2-wasm-resources.mjs \
            dist/wasm/aapt2/aapt2.js dist/toolchains/android/sdk/36/android.jar
          node ci/verify-aapt2-browser-adapter.mjs \
            dist/wasm/aapt2/aapt2.js dist/toolchains/android/sdk/36/android.jar
          echo "Port AAPT2 WASM réel vérifié dans l'adaptateur navigateur : publication autorisée."
      - name: Préparer le site statique
        run: |
          cp index.html dist/
          mkdir -p dist/src
          cp src/*.mjs dist/src/
          cp README.md dist/
          cp google-pack-source/LICENSE dist/LICENSE-GOOGLE-PACK
          touch dist/.nojekyll
          test -s dist/index.html
      - name: Fournir l'archive complète avec WASM
        uses: actions/upload-artifact@v4
        with:
          name: apk-forge-browser-avec-wasm
          path: dist/
          retention-days: 30
      - name: Détecter si GitHub Pages est activé
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages disponible : préparation du déploiement."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Le WASM est compilé et téléchargeable dans les Artifacts. Active GitHub Pages dans Settings > Pages > Source: GitHub Actions pour la publication automatique."
          fi
      - name: Configurer GitHub Pages
        if: steps.pages.outputs.enabled == 'true' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Préparer le site pour GitHub Pages
        if: steps.pages.outputs.enabled == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
  deploy:
    needs: build
    if: needs.build.outputs.pages_enabled == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer le compilateur statique
        id: deployment
        uses: actions/deploy-pages@v4
